name: Checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "25"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, test, and verify artifacts
        run: make verify-artifacts

  project:
    name: Messagevisor project-1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Java SDK
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Initialize Messagevisor project-1
        env:
          npm_config_yes: "true"
        run: |
          mkdir project-1
          cd project-1
          npx @messagevisor/cli init --project=1
          npm install
          npx messagevisor lint
          npx messagevisor build
          npx messagevisor test

      - name: Run project tests against Java SDK
        run: >-
          ./gradlew :cli:run
          --args='test --projectDirectoryPath=project-1 --onlyFailures --target=java
          --normalizeSpaces --withIcuModule --withInterpolationModule'
